# Publica el sitio en GitHub Pages en cada push a main.
# Sólo se publican los archivos del sitio (no los datos crudos ni los scripts).
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Reunir los archivos del sitio
        run: |
          mkdir -p _site/data
          cp index.html acerca.html .nojekyll _site/
          cp -r css js _site/
          cp -r data/procesado data/geo _site/data/
          rm -rf _site/data/geo/fuente
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
